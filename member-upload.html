<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE IMAGE, EVERY DAY · 회원 이미지 등록</title>
    <style>
        :root {
            --bg: #f6f4ef;
            --text: #171717;
            --muted: #77736c;
            --line: #ddd9d0;
            --card: #fffdf8;
            --accent: #6b513d
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, "Noto Sans KR", sans-serif
        }

        header {
            padding: 22px 5vw;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap
        }

        a {
            color: inherit
        }

        .logo {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .06em;
            text-decoration: none
        }

        main {
            max-width: 820px;
            margin: 40px auto;
            padding: 0 20px
        }

        h1 {
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -.04em;
            margin: 0 0 10px
        }

        h2 {
            font-size: 20px;
            margin: 0 0 18px
        }

        .muted {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 24px;
            margin: 22px 0;
            border-radius: 8px
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px
        }

        .full {
            grid-column: 1/-1
        }

        label {
            font-size: 13px;
            font-weight: 700
        }

        input,
        textarea {
            width: 100%;
            font: inherit;
            font-size: 14px;
            padding: 12px;
            border: 1px solid #cfc9be;
            background: white;
            border-radius: 5px
        }

        textarea {
            min-height: 140px;
            resize: vertical
        }

        input[type=file] {
            padding: 10px
        }

        button {
            border: 0;
            background: #171717;
            color: #fff;
            padding: 13px 17px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px
        }

        button:disabled {
            opacity: .5;
            cursor: wait
        }

        .secondary {
            background: #e8e3d9;
            color: #171717
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px
        }

        .message {
            font-size: 13px;
            line-height: 1.6;
            margin-top: 14px;
            white-space: pre-wrap
        }

        .notice {
            padding: 12px;
            background: #f0ebe1;
            font-size: 13px;
            line-height: 1.65;
            margin: 16px 0;
            border-radius: 5px
        }

        .hidden {
            display: none !important
        }

        @media(max-width:620px) {

            .grid {
                grid-template-columns: 1fr
            }

            .full {
                grid-column: auto
            }

            .panel {
                padding: 18px
            }
        }

        
            /* 이미지 미리보기 영역 */
            .image-editor {
                width: 100%;
                margin-top: 16px;
            }

            .image-crop-frame {
                width: 100%;
                max-width: 600px;
                height: 360px;
                overflow: hidden;
                position: relative;
                background: #e8e3d9;
                border-radius: 6px;
                cursor: grab;
                touch-action: none;
            }

            .image-crop-frame img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
                transform-origin: center center;
                user-select: none;
                -webkit-user-drag: none;
            }

            #image-zoom {
                width: 100%;
                margin: 12px 0;
            }
    </style>
</head>

<body>
    <header>
        <a class="logo" href="./index.html">ONE IMAGE, EVERY DAY.</a>
        <a href="./index.html">홈페이지로 돌아가기 ↗</a>
    </header>
    <main>
        <div>
            <h1>이미지 등록</h1>
            <div class="muted">승인된 회원은 이미지와 제작 프롬프트를 등록할 수 있습니다. 등록한 이미지는 공개 갤러리에 표시됩니다.</div>
        </div>
        <div class="notice">이미지는 전체 방문자에게 공개됩니다. 프롬프트는 승인 회원만 열람할 수 있도록 설정되어 있습니다. 등록 후에는 게시물이 바로 공개됩니다.</div>

        <section class="panel" id="login-panel">
            <h2>회원 로그인</h2>
            <form id="login-form" class="grid">
                <div class="field full"><label for="email">이메일</label><input id="email" type="email"
                        autocomplete="username" required></div>
                <div class="field full"><label for="password">비밀번호</label><input id="password" type="password"
                        autocomplete="current-password" required></div>
                <div class="field full"><button id="login-button" type="submit">로그인</button></div>
            </form>
            <div id="login-message" class="message" role="status"></div>
        </section>

        <section class="panel hidden" id="upload-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
                <h2>새 이미지 등록</h2><button id="logout-button" class="secondary" type="button">로그아웃</button>
            </div>
            <div id="member-status" class="muted"></div>
            <form id="image-form" class="hidden">
                <div class="grid" style="margin-top:18px">
                    <div class="field"><label for="day-number">DAY 번호 *</label><input id="day-number" type="number"
                            min="1" step="1" required placeholder="1"></div>
                    <div class="field"><label for="image-date">이미지 날짜 *</label><input id="image-date" type="date"
                            required></div>
                    <div class="field full"><label for="title">제목 *</label><input id="title" type="text" required
                            maxlength="200" placeholder="이미지 제목"></div>

                    <div class="field full">
                        <label for="image-file">이미지 파일 *</label>
                        <input id="image-file" type="file" accept="image/*" required>

                        <div id="image-editor" class="image-editor hidden">
                            <p>이미지를 드래그해 표시할 위치를 선택하세요.</p>

                            <div id="image-crop-frame" class="image-crop-frame">
                                <img id="image-preview" alt="이미지 표시 영역 미리보기">
                            </div>

                            <label for="image-zoom">확대·축소</label>
                            <input id="image-zoom" type="range" min="1" max="3" step="0.05" value="1">

                            <button type="button" id="image-reset" class="secondary">
                                위치 초기화
                            </button>
                        </div>
                    </div>

                    <div class="field full"><label for="prompt">이미지 생성 프롬프트 *</label><textarea id="prompt" required
                            placeholder="이미지를 만들 때 사용한 프롬프트"></textarea></div>
                    <div class="field full"><label for="description">설명 (선택)</label><textarea id="description"
                            placeholder="이미지에 대한 짧은 설명"></textarea></div>
                    <div class="field full"><label for="tags">태그 (쉼표로 구분)</label><input id="tags" type="text"
                            placeholder="chibi, concert, purple light"></div>
                </div>
                <div class="actions"><button id="save-button" type="submit">등록하기</button></div>
            </form>
            <div id="form-message" class="message" role="status"></div>
        </section>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './config.js';

        const $ = id => document.getElementById(id);
        let supabase = null;
        let currentUser = null;
        let isApproved = false;


        let imagePositionX = 50;
        let imagePositionY = 50;
        let imageZoom = 1;
        let previewObjectUrl = null;

        const imageFileInput = $('image-file');
        const imageEditor = $('image-editor');
        const cropFrame = $('image-crop-frame');
        const imagePreview = $('image-preview');
        const zoomInput = $('image-zoom');

        function updateImagePreview() {
            imagePreview.style.objectPosition =
                `${imagePositionX}% ${imagePositionY}%`;
            imagePreview.style.transform = `scale(${imageZoom})`;
        }

        imageFileInput.addEventListener('change', () => {
            const file = imageFileInput.files[0];

            if (previewObjectUrl) {
                URL.revokeObjectURL(previewObjectUrl);
                previewObjectUrl = null;
            }

            if (!file || !file.type.startsWith('image/')) {
                imageEditor.classList.add('hidden');
                imagePreview.removeAttribute('src');
                return;
            }

            previewObjectUrl = URL.createObjectURL(file);
            imagePreview.src = previewObjectUrl;
            imagePositionX = 50;
            imagePositionY = 50;
            imageZoom = 1;
            zoomInput.value = '1';

            updateImagePreview();
            imageEditor.classList.remove('hidden');
        });

        zoomInput.addEventListener('input', () => {
            imageZoom = Number(zoomInput.value);
            updateImagePreview();
        });

        let dragging = false;
        let lastPointerX = 0;
        let lastPointerY = 0;

        cropFrame.addEventListener('pointerdown', event => {
            if (!imagePreview.src) return;
            dragging = true;
            lastPointerX = event.clientX;
            lastPointerY = event.clientY;
            cropFrame.setPointerCapture(event.pointerId);
        });

        cropFrame.addEventListener('pointermove', event => {
            if (!dragging) return;

            const rect = cropFrame.getBoundingClientRect();
            const dx = event.clientX - lastPointerX;
            const dy = event.clientY - lastPointerY;

            imagePositionX = Math.max(
                0, Math.min(100, imagePositionX - dx / rect.width * 100)
            );
            imagePositionY = Math.max(
                0, Math.min(100, imagePositionY - dy / rect.height * 100)
            );

            lastPointerX = event.clientX;
            lastPointerY = event.clientY;
            updateImagePreview();
        });

        function stopDragging() {
            dragging = false;
        }

        cropFrame.addEventListener('pointerup', stopDragging);
        cropFrame.addEventListener('pointercancel', stopDragging);

        $('image-reset').addEventListener('click', () => {
            imagePositionX = 50;
            imagePositionY = 50;
            imageZoom = 1;
            zoomInput.value = '1';
            updateImagePreview();
        });


        function say(id, message) { $(id).textContent = message || ''; }
        function showLoggedOut() {
            currentUser = null; isApproved = false;
            $('login-panel').classList.remove('hidden');
            $('upload-panel').classList.add('hidden');
            $('image-form').classList.add('hidden');
            say('login-message', '');
        }

        async function checkMember(user) {
            currentUser = user;
            $('login-panel').classList.add('hidden');
            $('upload-panel').classList.remove('hidden');
            $('image-form').classList.add('hidden');
            say('member-status', '회원 승인 상태를 확인하는 중…');
            say('form-message', '');

            const { data: approved, error } = await supabase.rpc('member_is_approved');
            if (error) {
                isApproved = false;
                say('member-status', '승인 상태를 확인하지 못했습니다. 관리자에게 문의해 주세요.');
                say('form-message', error.message);
                return;
            }
            isApproved = approved === true;
            if (!isApproved) {
                say('member-status', '아직 승인되지 않은 계정입니다. 관리자의 승인이 완료되면 등록할 수 있습니다.');
                return;
            }
            say('member-status', '승인된 회원으로 로그인했습니다. 등록한 이미지는 즉시 공개됩니다.');
            $('image-form').classList.remove('hidden');
        }

        $('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            say('login-message', '로그인 중…');
            $('login-button').disabled = true;
            const { data, error } = await supabase.auth.signInWithPassword({
                email: $('email').value.trim(),
                password: $('password').value
            });
            $('login-button').disabled = false;
            if (error) { say('login-message', '로그인하지 못했습니다. 이메일과 비밀번호를 확인해 주세요.'); return; }
            await checkMember(data.user);
        });

        $('logout-button').addEventListener('click', async () => {
            await supabase.auth.signOut();
            showLoggedOut();
        });

        $('image-form').addEventListener('submit', async e => {
            e.preventDefault();
            if (!currentUser || !isApproved) { say('form-message', '승인된 회원만 등록할 수 있습니다.'); return; }
            const file = $('image-file').files[0];
            if (!file || !file.type.startsWith('image/')) { say('form-message', '이미지 파일을 선택해 주세요.'); return; }

            const btn = $('save-button');
            btn.disabled = true;
            say('form-message', '이미지 업로드 및 저장 중…');
            let uploadedPath = null;
            try {
                const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
                uploadedPath = `${currentUser.id}/${Date.now()}-${cleanName}`;
                const { error: uploadError } = await supabase.storage.from('images').upload(uploadedPath, file, {
                    cacheControl: '3600', upsert: false
                });
                if (uploadError) throw uploadError;

                const { data: publicData } = supabase.storage.from('images').getPublicUrl(uploadedPath);
                const payload = {
                    title: $('title').value.trim(),
                    image_date: $('image-date').value,
                    day_number: Number($('day-number').value),
                    prompt: $('prompt').value.trim(),
                    image_url: publicData.publicUrl,
                    tags: $('tags').value.split(',').map(x => x.trim()).filter(Boolean).join(', '),
                    description: $('description').value.trim() || null,
                    image_position_x: imagePositionX,
                    image_position_y: imagePositionY,
                    image_zoom: imageZoom
                };

                const { error: insertError } = await supabase
                    .from('daily_images')
                    .insert(payload);

                if (insertError) throw insertError;

                $('image-form').reset();
                say('form-message', '등록이 완료됐어요! 이미지가 공개 갤러리에 반영됩니다. 메인 페이지 반영 여부는 사이트의 갤러리 연결 방식에 따라 확인이 필요합니다.');
            } catch (err) {
                say('form-message', '등록에 실패했습니다. 관리자에게 오류 내용을 전달해 주세요.\n' + (err?.message || String(err)));
            } finally {
                btn.disabled = false;
            }
        });

        async function init() {
            if (!SUPABASE_URL?.startsWith('https://') || !SUPABASE_PUBLISHABLE_KEY || SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_')) {
                say('login-message', 'config.js에 Supabase URL과 Publishable key가 설정되어 있는지 확인해 주세요.');
                $('login-button').disabled = true;
                return;
            }
            supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
            const { data: { session } } = await supabase.auth.getSession();
            if (session) await checkMember(session.user); else showLoggedOut();
            supabase.auth.onAuthStateChange(async (_event, session) => {
                if (session) await checkMember(session.user); else showLoggedOut();
            });
        }
        init();
    </script>
</body>

</html>
