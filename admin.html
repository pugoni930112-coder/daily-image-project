<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 승인 관리 · ONE IMAGE, EVERY DAY.</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 20px;
            background: #f8f7f4;
            color: #292821;
            font-family: Arial, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            max-width: 960px;
            margin: 0 auto 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .home-link {
            font-size: 13px;
            color: #77766e;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .intro, .muted {
            color: #77766e;
            line-height: 1.7;
            font-size: 14px;
        }

        .panel {
            margin-top: 28px;
            padding: 28px;
            background: #fff;
            border: 1px solid #e7e5df;
            border-radius: 12px;
        }

        .hidden {
            display: none !important;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8d6ce;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 13px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .primary {
            background: #292821;
            color: #fff;
        }

        .secondary {
            background: #eeede8;
            color: #292821;
        }

        .danger {
            background: #f8e9e6;
            color: #963e31;
        }

        .login-button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .member {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 18px;
            padding: 20px 0;
            border-top: 1px solid #eceae4;
        }

        .email {
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .meta {
            margin-top: 7px;
            color: #77766e;
            font-size: 12px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #eeede8;
            font-size: 12px;
        }

        .status.approved {
            background: #e6f3e8;
            color: #286b39;
        }

        .message {
            margin-top: 14px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 13px;
            line-height: 1.6;
            color: #8b4539;
        }

        @media (max-width: 520px) {
            body {
                padding: 24px 16px;
            }

            .panel {
                padding: 20px 16px;
            }

            h1 {
                font-size: 25px;
            }

            .member {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .member button {
                justify-self: start;
            }
        }
    </style>
</head>

<body>
    <header>
        <a class="logo" href="./index.html">
            ONE IMAGE, EVERY DAY. · ADMIN
        </a>
        <a class="home-link" href="./index.html">
            메인 홈페이지로 이동 ↗
        </a>
    </header>

    <main>
        <h1>회원 승인 관리</h1>
        <p class="intro">
            가입 회원을 확인하고 프롬프트 열람 권한을 관리합니다.
        </p>

        <section id="login-panel" class="panel">
            <h2>관리자 로그인</h2>
            <p class="muted">관리자 계정으로 로그인해 주세요.</p>

            <form id="login-form">
                <label for="email">이메일</label>
                <input id="email" type="email" autocomplete="username" required>

                <label for="password">비밀번호</label>
                <input id="password" type="password"
                    autocomplete="current-password" required>

                <button id="login-button" class="primary login-button"
                    type="submit">로그인</button>
            </form>

            <p id="login-message" class="message"></p>
        </section>

        <section id="members-panel" class="panel hidden">
            <div class="toolbar">
                <div>
                    <h2>가입 회원 목록</h2>
                    <p id="member-count" class="muted">불러오는 중…</p>
                </div>
                <div>
                    <button id="refresh-button" class="secondary" type="button">
                        새로고침
                    </button>
                    <button id="logout-button" class="secondary" type="button">
                        로그아웃
                    </button>
                </div>
            </div>

            <p id="list-message" class="message"></p>
            <div id="members-list"></div>
        </section>
    </main>

    <script type="module">
        import { createClient } from
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        import {
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        } from './config.js';

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const $ = id => document.getElementById(id);

        const loginPanel = $('login-panel');
        const membersPanel = $('members-panel');

        function escapeHtml(value = '') {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function showLoggedOut(message = '') {
            loginPanel.classList.remove('hidden');
            membersPanel.classList.add('hidden');
            $('login-message').textContent = message;
            $('members-list').innerHTML = '';
        }

        function showLoggedIn() {
            loginPanel.classList.add('hidden');
            membersPanel.classList.remove('hidden');
        }

        async function loadMembers() {
            $('list-message').textContent = '회원 목록을 불러오는 중…';
            $('members-list').innerHTML = '';

            const { data, error } = await supabase.rpc('admin_list_members');

            if (error) {
                $('member-count').textContent = '';
                $('list-message').textContent =
                    '회원 목록을 불러오지 못했습니다.\n' + error.message;
                return;
            }

            const members = data || [];
            $('member-count').textContent = `총 ${members.length}명`;
            $('list-message').textContent = '';

            if (members.length === 0) {
                $('members-list').innerHTML =
                    '<p class="muted">가입 회원이 없습니다.</p>';
                return;
            }

            $('members-list').innerHTML = members.map(member => `
                <article class="member">
                    <div>
                        <div class="email">${escapeHtml(member.email || '(이메일 없음)')}</div>
                        <div class="meta">
                            가입일: ${member.created_at
                                ? escapeHtml(new Date(member.created_at).toLocaleString('ko-KR'))
                                : '-'}
                        </div>
                        <span class="status ${member.approved ? 'approved' : ''}">
                            ${member.approved ? '승인 완료' : '승인 대기'}
                        </span>
                    </div>

                    <button
                        type="button"
                        class="${member.approved ? 'danger' : 'primary'}"
                        data-user-id="${escapeHtml(member.id)}"
                        data-approved="${member.approved ? 'true' : 'false'}">
                        ${member.approved ? '승인 취소' : '승인하기'}
                    </button>
                </article>
            `).join('');

            $('members-list').querySelectorAll('button[data-user-id]')
                .forEach(button => {
                    button.addEventListener('click', () => changeApproval(button));
                });
        }

        async function changeApproval(button) {
            const userId = button.dataset.userId;
            const currentlyApproved = button.dataset.approved === 'true';
            const nextValue = !currentlyApproved;

            const action = nextValue ? '승인' : '승인 취소';

            if (!confirm(`이 회원의 가입을 ${action}하시겠습니까?`)) {
                return;
            }

            button.disabled = true;
            $('list-message').textContent = `${action} 처리 중…`;

            const { error } = await supabase.rpc('admin_set_member_approval', {
                target_user_id: userId,
                approval_value: nextValue
            });

            if (error) {
                $('list-message').textContent =
                    `${action}에 실패했습니다.\n${error.message}`;
                button.disabled = false;
                return;
            }

            $('list-message').textContent = `${action} 처리가 완료됐습니다.`;
            await loadMembers();
        }

        async function verifyAdmin() {
            const { data: { session }, error: sessionError } =
                await supabase.auth.getSession();

            if (sessionError || !session) {
                showLoggedOut();
                return;
            }

            // 관리자 전용 RPC가 권한을 확인하도록 요청
            const { error } = await supabase.rpc('admin_list_members');

            if (error) {
                await supabase.auth.signOut();
                showLoggedOut(
                    '관리자 권한을 확인하지 못했습니다. 관리자 계정을 확인해 주세요.'
                );
                return;
            }

            showLoggedIn();
            await loadMembers();
        }

        $('login-form').addEventListener('submit', async event => {
            event.preventDefault();

            const button = $('login-button');
            button.disabled = true;
            $('login-message').textContent = '로그인 중…';

            try {
                const { error } = await supabase.auth.signInWithPassword({
                    email: $('email').value.trim(),
                    password: $('password').value
                });

                if (error) {
                    $('login-message').textContent =
                        '로그인에 실패했습니다.\n' + error.message;
                    return;
                }

                await verifyAdmin();
            } finally {
                button.disabled = false;
            }
        });

        $('refresh-button').addEventListener('click', loadMembers);

        $('logout-button').addEventListener('click', async () => {
            await supabase.auth.signOut();
            showLoggedOut('로그아웃했습니다.');
        });

        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || !session) {
                showLoggedOut();
            }
        });

        await verifyAdmin();
    </script>
</body>
</html>
